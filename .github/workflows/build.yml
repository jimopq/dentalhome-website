# 後台存檔後自動重新產生網頁並提交。
# 只在「來源」變動時觸發；產生出來的 .html / sitemap.xml / redirects.txt
# 不在觸發清單內，所以機器人的提交不會再次觸發自己，不會形成迴圈。
name: 重新產生網站

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build.js'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 產生頁面
        run: node build.js

      - name: 檢查產出
        run: |
          count=$(ls -1 *.html | wc -l)
          echo "產生 $count 個頁面"
          if [ "$count" -lt 50 ]; then
            echo "::error::頁面數異常偏低（$count），中止提交以免覆蓋正常版本"
            exit 1
          fi
          test -s sitemap.xml || { echo "::error::sitemap.xml 是空的"; exit 1; }

      - name: 提交變更
        run: |
          git config user.name  "wenxin-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- '*.html' sitemap.xml robots.txt redirects.txt
          if git diff --cached --quiet; then
            echo "沒有變更，略過提交"
          else
            git commit -m "自動重建網站 [skip ci]"
            git push
          fi
